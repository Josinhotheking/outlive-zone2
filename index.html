<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Zone 2 Training April 2026</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body, #root { height: 100%; }
      .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
      .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      // ================== CONFIG ==================
      const CONFIG = {
        name: "Jos",
        pin: "1111",
        zone2Goal: 1250,
        zone5Goal: 120,
        strengthGoal: 9 // ~2x per week
      };

      const NOTE_OPTIONS = [
        "Voelde me sterk 💪",
        "Verpletterd 🔥",
        "Zware sessie 😤",
        "Benen moe 🦵",
        "Relaxed tempo 😌",
        "Moest knokken 😮‍💨",
        "Perfecte flow 🌊",
        "Custom..."
      ];

      // ================== HELPERS ==================
      const YMD = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      const fromYMD = s => new Date(`${s}T00:00:00`);

      function challengeRange() {
        return { start: new Date("2026-04-01T00:00:00"), end: new Date("2026-04-30T00:00:00") };
      }
      function enumerateDays(start, end) {
        const out = [];
        const d = new Date(start);
        while (d <= end) { out.push(YMD(d)); d.setDate(d.getDate() + 1); }
        return out;
      }
      function daysBetweenInclusive(d1, d2) {
        const a = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate());
        const b = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate());
        const ms = b - a;
        return Math.floor(ms / 86400000) + 1;
      }
      function radialStyle() {
        return {
          background: "radial-gradient(1200px circle at 50% 20%, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 25%, rgba(210,236,255,0.9) 38%, rgba(232,249,225,0.85) 52%, rgba(255,238,246,0.85) 66%, rgba(255,255,255,1) 100%)",
          minHeight: "100vh"
        };
      }
      const classNames = (...a) => a.filter(Boolean).join(" ");

      // Goggins quotes
      const QUOTES = [
        "I don't stop when I'm tired, I stop when I'm done.",
        "When you think that you are done, you're only 40% in.",
        "Stay hard.",
        "We don't rise to the level of our expectations, we fall to the level of our training.",
        "Pain unlocks a secret doorway in the mind.",
        "It's you versus you.",
        "Be uncommon amongst uncommon people.",
        "Every minute counts."
      ];
      const pickQuote = () => QUOTES[Math.floor(Math.random() * QUOTES.length)];

      // ============ STORAGE + URL SYNC ============
      const LS_KEY = "outlive_zone2_5_april_2026_jos_v3";
      
      function hardReset() {
        try { localStorage.removeItem(LS_KEY); } catch {}
        const url = new URL(window.location);
        url.searchParams.delete('data');
        window.history.replaceState(null, '', url);
        location.reload();
      }

      function loadFromURL() {
        try {
          const params = new URLSearchParams(window.location.search);
          const dataParam = params.get('data');
          if (dataParam) {
            const decoded = atob(dataParam);
            const parsed = JSON.parse(decoded);
            localStorage.setItem(LS_KEY, JSON.stringify(parsed));
            params.delete('data');
            const cleanUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
            window.history.replaceState(null, '', cleanUrl);
            return parsed;
          }
        } catch (e) {
          console.error('Failed to load from URL:', e);
        }
        return null;
      }

      try {
        const usp = new URLSearchParams(location.search);
        if (usp.get("reset") === "1") {
          localStorage.removeItem(LS_KEY);
          usp.delete("reset");
          const clean = location.pathname + (usp.toString() ? "?" + usp.toString() : "");
          history.replaceState(null, "", clean);
        }
      } catch {}

      const loadLocal = () => { 
        const urlData = loadFromURL();
        if (urlData) return urlData;
        try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } 
      };
      const saveLocal = db => localStorage.setItem(LS_KEY, JSON.stringify(db));

      function exportToURL(db) {
        try {
          const json = JSON.stringify(db);
          const encoded = btoa(json);
          const url = new URL(window.location);
          url.searchParams.set('data', encoded);
          return url.toString();
        } catch (e) {
          console.error('Failed to export:', e);
          return null;
        }
      }

      function getMonthMatrix(year, monthIndex) {
        const first = new Date(year, monthIndex, 1);
        const last = new Date(year, monthIndex + 1, 0);
        const daysInMonth = last.getDate();
        const startWeekday = (first.getDay() + 6) % 7;
        const cells = [];
        for (let i = 0; i < startWeekday; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, monthIndex, d));
        while (cells.length % 7 !== 0) cells.push(null);
        return cells;
      }
      const WEEKDAYS = ["Ma","Di","Wo","Do","Vr","Za","Zo"];

      // ============ STREAK CALCULATION ============
      function calculateStreaks(entries, allDays) {
        let currentStreak = 0;
        let longestStreak = 0;
        let tempStreak = 0;
        const today = YMD(new Date());
        
        const sortedDays = allDays.slice().sort();
        
        for (let i = 0; i < sortedDays.length; i++) {
          const day = sortedDays[i];
          const entry = entries[day] || {};
          const totalMin = (parseInt(entry.zone2 || 0, 10) || 0) + (parseInt(entry.zone5 || 0, 10) || 0);
          
          if (totalMin > 0) {
            tempStreak++;
            longestStreak = Math.max(longestStreak, tempStreak);
            
            if (day <= today) {
              currentStreak = tempStreak;
            }
          } else {
            if (day < today) {
              tempStreak = 0;
            }
          }
        }
        
        return { current: currentStreak, longest: longestStreak };
      }

      // ============ PREDICTIONS ============
      function calculatePredictions(entries, allDays, zone2Total, zone5Total) {
        const today = new Date();
        const { start, end } = challengeRange();
        
        const daysPassed = allDays.filter(d => fromYMD(d) <= today).length;
        if (daysPassed === 0) return null;
        
        const zone2AvgPerDay = zone2Total / daysPassed;
        const zone5AvgPerDay = zone5Total / daysPassed;
        
        const zone2Remaining = Math.max(0, CONFIG.zone2Goal - zone2Total);
        const zone5Remaining = Math.max(0, CONFIG.zone5Goal - zone5Total);
        
        const zone2DaysNeeded = zone2AvgPerDay > 0 ? Math.ceil(zone2Remaining / zone2AvgPerDay) : 999;
        const zone5DaysNeeded = zone5AvgPerDay > 0 ? Math.ceil(zone5Remaining / zone5AvgPerDay) : 999;
        
        const zone2CompletionDate = new Date(today);
        zone2CompletionDate.setDate(zone2CompletionDate.getDate() + zone2DaysNeeded);
        
        const zone5CompletionDate = new Date(today);
        zone5CompletionDate.setDate(zone5CompletionDate.getDate() + zone5DaysNeeded);
        
        const totalDays = allDays.length;
        const expectedZone2 = (CONFIG.zone2Goal / totalDays) * daysPassed;
        const expectedZone5 = (CONFIG.zone5Goal / totalDays) * daysPassed;
        
        const zone2DaysAhead = Math.round((zone2Total - expectedZone2) / (CONFIG.zone2Goal / totalDays));
        const zone5DaysAhead = Math.round((zone5Total - expectedZone5) / (CONFIG.zone5Goal / totalDays));
        
        return {
          zone2CompletionDate: zone2CompletionDate <= end ? zone2CompletionDate : null,
          zone5CompletionDate: zone5CompletionDate <= end ? zone5CompletionDate : null,
          zone2DaysAhead,
          zone5DaysAhead,
          zone2AvgPerDay: Math.round(zone2AvgPerDay),
          zone5AvgPerDay: Math.round(zone5AvgPerDay * 10) / 10
        };
      }

      // ============ SESSION RECORDS ============
      function calculateRecords(entries, allDays) {
        let longestSession = 0;
        let mostZone5 = 0;
        let bestWeek = 0;
        
        Object.values(entries).forEach(entry => {
          const total = (parseInt(entry.zone2 || 0, 10) || 0) + (parseInt(entry.zone5 || 0, 10) || 0);
          const z5 = parseInt(entry.zone5 || 0, 10) || 0;
          longestSession = Math.max(longestSession, total);
          mostZone5 = Math.max(mostZone5, z5);
        });
        
        const sortedDays = allDays.slice().sort();
        for (let i = 0; i <= sortedDays.length - 7; i++) {
          const weekDays = sortedDays.slice(i, i + 7);
          const weekTotal = weekDays.reduce((sum, day) => {
            const entry = entries[day] || {};
            return sum + (parseInt(entry.zone2 || 0, 10) || 0) + (parseInt(entry.zone5 || 0, 10) || 0);
          }, 0);
          bestWeek = Math.max(bestWeek, weekTotal);
        }
        
        return { longestSession, mostZone5, bestWeek };
      }

      // ================== APP ==================
      function App() {
        const { start, end } = React.useMemo(() => challengeRange(), []);
        const allDays = React.useMemo(() => enumerateDays(start, end), [start, end]);

        const [db, setDb] = React.useState(loadLocal());
        const [loggedIn, setLoggedIn] = React.useState(false);
        const [quote, setQuote] = React.useState("");
        const [modal, setModal] = React.useState(null);
        const [showExport, setShowExport] = React.useState(false);

        React.useEffect(() => saveLocal(db), [db]);

        function setMinutes(ymd, zone2, zone5, strength, note) {
          setDb(cur => {
            const next = { ...cur };
            next.entries = { ...next.entries, [ymd]: { zone2, zone5, strength, note } };
            return next;
          });
        }
        
        function resetEntries() {
          if (!confirm("Weet je zeker dat je alle minuten wilt resetten?")) return;
          setDb({ entries: {} });
        }

        function totalZone2() {
          return Object.values(db.entries || {}).reduce((a, b) => {
            const z2 = parseInt(b?.zone2 || 0, 10) || 0;
            const z5 = parseInt(b?.zone5 || 0, 10) || 0;
            return a + z2 + z5;
          }, 0);
        }
        
        function totalZone5() {
          return Object.values(db.entries || {}).reduce((a, b) => a + (parseInt(b?.zone5 || 0, 10) || 0), 0);
        }

        function totalStrength() {
          return Object.values(db.entries || {}).reduce((a, b) => a + (b?.strength ? 1 : 0), 0);
        }
        
        function remainingDaysFromToday(today = new Date()) {
          const { start, end } = challengeRange();
          const t0 = new Date(Math.max(today.setHours(0,0,0,0), new Date(start).setHours(0,0,0,0)));
          const endNorm = new Date(end.getFullYear(), end.getMonth(), end.getDate());
          if (t0 > endNorm) return 0;
          return daysBetweenInclusive(t0, endNorm);
        }

        const streaks = React.useMemo(() => calculateStreaks(db.entries || {}, allDays), [db.entries, allDays]);
        const predictions = React.useMemo(() => calculatePredictions(db.entries || {}, allDays, totalZone2(), totalZone5()), [db.entries, allDays]);
        const records = React.useMemo(() => calculateRecords(db.entries || {}, allDays), [db.entries, allDays]);

        return (
          <div style={radialStyle()} className="text-slate-900">
            <div className="max-w-6xl mx-auto px-4 py-8">
              <Header />
              {!loggedIn ? (
                <LoginScreen onLogin={() => setLoggedIn(true)} />
              ) : (
                <MainScreen
                  db={db}
                  allDays={allDays}
                  setLoggedIn={setLoggedIn}
                  totalZone2={totalZone2}
                  totalZone5={totalZone5}
                  totalStrength={totalStrength}
                  remainingDaysFromToday={remainingDaysFromToday}
                  openModal={(ymd, z2, z5, str, note) => setModal({ dateYMD: ymd, zone2: z2, zone5: z5, strength: str, note: note })}
                  resetEntries={resetEntries}
                  onHardReset={hardReset}
                  onExport={() => setShowExport(true)}
                  streaks={streaks}
                  predictions={predictions}
                  records={records}
                />
              )}

              {modal && loggedIn && (
                <MinutesModal
                  dateYMD={modal.dateYMD}
                  initialZone2={modal.zone2}
                  initialZone5={modal.zone5}
                  initialStrength={modal.strength}
                  initialNote={modal.note}
                  onCancel={() => setModal(null)}
                  onSave={(z2, z5, str, note) => {
                    setMinutes(modal.dateYMD, z2, z5, str, note);
                    setModal(null);
                    setQuote(pickQuote());
                  }}
                />
              )}

              {showExport && (
                <ExportModal
                  url={exportToURL(db)}
                  onClose={() => setShowExport(false)}
                />
              )}

              {quote && (
                <div className="fixed inset-x-0 bottom-0 p-4">
                  <div className="max-w-3xl mx-auto rounded-2xl bg-white/90 backdrop-blur shadow-lg p-4 text-center border border-slate-200">
                    <p className="text-lg font-medium italic">{quote}</p>
                    <button className="mt-3 px-4 py-2 rounded-xl bg-slate-900 text-white" onClick={() => setQuote("")}>Sluiten</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ================== UI COMPONENTS ==================
      const Header = () => (
        <div className="mb-8 text-center">
          <div className="text-xs tracking-widest text-slate-600">Zone 2 + Zone 5 + Kracht</div>
          <h1 className="text-4xl md:text-5xl font-semibold tracking-tight mt-1">April 2026</h1>
          <p className="text-slate-600 mt-2">1250 min Z2 • 120 min Z5 • 9 krachtsessies</p>
        </div>
      );

      function LoginScreen({ onLogin }) {
        const [pin, setPin] = React.useState("");
        const [error, setError] = React.useState("");

        function handleLogin() {
          if (pin !== CONFIG.pin) { 
            setError("Verkeerde pincode"); 
            return; 
          }
          onLogin();
        }

        return (
          <div className="max-w-4xl mx-auto grid md:grid-cols-2 gap-8 items-start">
            <div className="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
              <h2 className="text-2xl font-semibold">Welkom {CONFIG.name}</h2>
              <div className="mt-4">
                <label className="block text-sm">Pincode</label>
                <input 
                  className="mt-1 w-full border rounded-xl px-3 py-2" 
                  type="password" 
                  inputMode="numeric" 
                  value={pin} 
                  onChange={e => setPin(e.target.value)} 
                  onKeyDown={e => e.key === 'Enter' && handleLogin()}
                  placeholder="Vier cijfers" 
                />
              </div>

              {error && <p className="mt-3 text-red-600">{error}</p>}

              <button className="mt-6 w-full bg-slate-900 text-white rounded-xl py-3" onClick={handleLogin}>
                Start
              </button>

              <div className="mt-6 bg-slate-50 rounded-xl p-4">
                <div className="text-sm font-semibold mb-2">Doelen:</div>
                <div className="text-sm text-slate-700">
                  • Zone 2+: <strong>1250 minuten</strong><br/>
                  • Zone 5: <strong>120 minuten</strong><br/>
                  • Kracht: <strong>9 sessies</strong>
                </div>
                <p className="text-xs text-slate-600 mt-2">Zone 5 telt mee voor Zone 2 doel</p>
              </div>

              <div className="mt-3 text-center">
                <a className="text-xs text-slate-500 underline" href="?reset=1">Reset lokale data</a>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
              <h3 className="text-xl font-semibold text-slate-900 mb-3">April Challenge</h3>
              <p className="text-sm leading-relaxed text-slate-700 mb-3">
                Deze maand train je alle drie de systemen. Zone 2 bouwt je aerobe base. Zone 5 verhoogt je VO2 max. 
                Kracht houdt je functioneel sterk. 
              </p>
              <p className="text-sm leading-relaxed text-slate-700">
                Zone 5 minuten tellen mee voor je Zone 2 totaal. 2x kracht per week houdt je functioneel sterk. 
                Elke minuut telt. Stay hard.
              </p>
            </div>
          </div>
        );
      }

      function MainScreen({ db, allDays, setLoggedIn, totalZone2, totalZone5, totalStrength, remainingDaysFromToday, openModal, resetEntries, onHardReset, onExport, streaks, predictions, records }) {
        const entries = db.entries || {};
        const zone2Total = totalZone2();
        const zone2Remaining = Math.max(0, CONFIG.zone2Goal - zone2Total);
        
        const zone5Total = totalZone5();
        const zone5Remaining = Math.max(0, CONFIG.zone5Goal - zone5Total);

        const strengthTotal = totalStrength();
        const strengthRemaining = Math.max(0, CONFIG.strengthGoal - strengthTotal);

        const today = new Date();
        const { start, end } = challengeRange();
        const clampedStart = today < start ? start : today;
        const remDays = Math.max(0, remainingDaysFromToday(clampedStart));
        const zone2NeededPerDay = remDays > 0 ? Math.ceil(zone2Remaining / remDays) : zone2Remaining;
        const zone5NeededPerDay = remDays > 0 ? Math.ceil(zone5Remaining / remDays) : zone5Remaining;

        const aprCells = getMonthMatrix(2026, 3);

        function cumulativeUntil(ymd) {
          let sum = 0;
          for (const d of allDays) {
            const entry = entries?.[d] || {};
            sum += parseInt(entry.zone2 || 0, 10) + parseInt(entry.zone5 || 0, 10);
            if (d === ymd) break;
          }
          return sum;
        }
        function planCumUntil(ymd) {
          const idx = allDays.indexOf(ymd);
          if (idx < 0) return 0;
          const per = CONFIG.zone2Goal / allDays.length;
          return Math.round(per * (idx + 1));
        }
        function badges() {
          const arr = [];
          if (zone2Total >= 500) arr.push("500 Zone 2+");
          if (zone2Total >= 750) arr.push("750 Zone 2+");
          if (zone2Total >= 1000) arr.push("1000 Zone 2+");
          if (zone2Total >= 1250) arr.push("1250 Zone 2+ ✓");
          if (zone5Total >= 60) arr.push("60 Zone 5");
          if (zone5Total >= 120) arr.push("120 Zone 5 ✓");
          if (strengthTotal >= 4) arr.push("4 krachtsessies");
          if (strengthTotal >= 9) arr.push("9 krachtsessies ✓");
          
          if (streaks.current >= 7) arr.push("🔥 7-dagen warrior");
          if (streaks.current >= 14) arr.push("🔥 14-dagen beast");
          if (streaks.current >= 21) arr.push("🔥 21-dagen legend");
          
          return arr;
        }

        function dayCell(d) {
          if (!d) return <div className="h-20 rounded-xl bg-slate-50"></div>;
          const ymd = YMD(d);
          if (d < start || d > end) return <div className="h-20 rounded-xl bg-slate-50"></div>;
          const entry = entries?.[ymd] || {};
          const zone2Min = parseInt(entry.zone2 || 0, 10);
          const zone5Min = parseInt(entry.zone5 || 0, 10);
          const totalMin = zone2Min + zone5Min;
          const hasStrength = entry.strength;
          const isToday = YMD(new Date()) === ymd;

          const cum = cumulativeUntil(ymd);
          const plan = planCumUntil(ymd);
          const delta = cum - plan;

          let borderClr = "border-slate-200";
          if (totalMin > 0 && delta >= 0) borderClr = "border-emerald-400";
          else if (totalMin > 0 && delta < 0) borderClr = "border-rose-300";

          const hasZone5 = zone5Min > 0;
          const hasNote = entry.note && entry.note.trim();

          return (
            <button
              key={ymd}
              onClick={() => openModal(ymd, zone2Min, zone5Min, hasStrength, entry.note)}
              className={classNames("h-20 rounded-xl border p-2 text-left hover:shadow-sm transition", borderClr, isToday ? "ring-2 ring-slate-900" : "", hasZone5 ? "bg-amber-50" : "")}
              title={hasNote ? entry.note : `Plan ${plan} min, cumulatief ${cum} min`}
            >
              <div className="text-xs text-slate-600 flex justify-between">
                <span>{d.toLocaleDateString("nl-NL",{ day:"2-digit", month:"short" })}</span>
                {hasStrength && <span>💪</span>}
              </div>
              <div className="text-sm font-semibold mt-1">{totalMin} min</div>
              {hasZone5 && <div className="text-xs text-amber-600">Z5: {zone5Min}</div>}
              {hasNote && <div className="text-xs text-slate-400 truncate">💬</div>}
            </button>
          );
        }

        return (
          <div className="max-w-4xl mx-auto space-y-6">
            <Card>
              <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div>
                  <h2 className="text-2xl font-semibold">Welkom {CONFIG.name}</h2>
                  <p className="text-slate-600 text-sm">1250 min Z2 | 120 min Z5 | 9x Kracht</p>
                </div>
                <div className="flex items-center gap-2">
                  <button className="px-3 py-2 rounded-xl border bg-blue-50 text-blue-700 hover:bg-blue-100" onClick={onExport}>
                    Sync
                  </button>
                  <button className="px-3 py-2 rounded-xl border" onClick={() => setLoggedIn(false)}>Uit</button>
                  <button className="px-3 py-2 rounded-xl border text-rose-700" onClick={resetEntries}>Reset</button>
                </div>
              </div>

              {/* Streak Display */}
              <div className="mb-4 bg-gradient-to-r from-orange-50 to-red-50 rounded-xl p-4 border border-orange-200">
                <div className="flex items-center justify-between">
                  <div>
                    <div className="text-sm text-slate-600">Huidige Streak</div>
                    <div className="text-3xl font-bold text-orange-600">
                      {streaks.current === 0 ? "🔴" : "🔥"} {streaks.current} {streaks.current === 1 ? "dag" : "dagen"}
                    </div>
                  </div>
                  <div className="text-right">
                    <div className="text-sm text-slate-600">Langste Streak</div>
                    <div className="text-2xl font-semibold text-slate-700">
                      🏆 {streaks.longest} {streaks.longest === 1 ? "dag" : "dagen"}
                    </div>
                  </div>
                </div>
              </div>

              <div className="space-y-4">
                {/* Zone 2 tracker */}
                <div className="bg-emerald-50 rounded-xl p-4 border border-emerald-200">
                  <div className="text-sm font-semibold text-emerald-900 mb-2">Zone 2+ Progress</div>
                  <div className="grid grid-cols-3 gap-3 text-center">
                    <Stat label="Nu" value={zone2Total} sub="minuten" />
                    <Stat label="Te gaan" value={zone2Remaining} sub="minuten" />
                    <Stat label="Per dag" value={zone2NeededPerDay} sub={remDays > 0 ? `${remDays}d` : "0d"} />
                  </div>
                  <div className="mt-3 bg-white rounded-lg h-3 overflow-hidden">
                    <div 
                      className="h-full bg-emerald-500 transition-all"
                      style={{ width: `${Math.min(100, (zone2Total / CONFIG.zone2Goal) * 100)}%` }}
                    />
                  </div>
                </div>

                {/* Zone 5 tracker */}
                <div className="bg-amber-50 rounded-xl p-4 border border-amber-200">
                  <div className="text-sm font-semibold text-amber-900 mb-2">Zone 5 Progress</div>
                  <div className="grid grid-cols-3 gap-3 text-center">
                    <Stat label="Nu" value={zone5Total} sub="minuten" />
                    <Stat label="Te gaan" value={zone5Remaining} sub="minuten" />
                    <Stat label="Per dag" value={zone5NeededPerDay} sub={remDays > 0 ? `${remDays}d` : "0d"} />
                  </div>
                  <div className="mt-3 bg-white rounded-lg h-3 overflow-hidden">
                    <div 
                      className="h-full bg-amber-500 transition-all"
                      style={{ width: `${Math.min(100, (zone5Total / CONFIG.zone5Goal) * 100)}%` }}
                    />
                  </div>
                </div>

                {/* Strength tracker */}
                <div className="bg-purple-50 rounded-xl p-4 border border-purple-200">
                  <div className="text-sm font-semibold text-purple-900 mb-2">Krachtsessies</div>
                  <div className="grid grid-cols-3 gap-3 text-center">
                    <Stat label="Gedaan" value={strengthTotal} sub="sessies" />
                    <Stat label="Te gaan" value={strengthRemaining} sub="sessies" />
                    <Stat label="Doel" value={CONFIG.strengthGoal} sub="dit month" />
                  </div>
                  <div className="mt-3 bg-white rounded-lg h-3 overflow-hidden">
                    <div 
                      className="h-full bg-purple-500 transition-all"
                      style={{ width: `${Math.min(100, (strengthTotal / CONFIG.strengthGoal) * 100)}%` }}
                    />
                  </div>
                </div>
              </div>

              {badges().length > 0 && (
                <div className="mt-4 flex flex-wrap gap-2">
                  {badges().map(b => (
                    <span key={b} className={classNames("px-3 py-1 rounded-full text-xs", 
                      b.includes("Zone 5") ? "bg-amber-600 text-white" : 
                      b.includes("kracht") ? "bg-purple-600 text-white" :
                      b.includes("🔥") ? "bg-orange-600 text-white" :
                      "bg-slate-900 text-white")}>{b}</span>
                  ))}
                </div>
              )}
            </Card>

            {/* Predictions */}
            {predictions && (
              <Card>
                <h3 className="text-lg font-semibold mb-3">📊 Voorspellingen & Tempo</h3>
                <div className="grid md:grid-cols-2 gap-4">
                  <div className="bg-emerald-50 rounded-lg p-3">
                    <div className="text-xs text-slate-600">Zone 2 Tempo</div>
                    <div className="text-lg font-semibold">{predictions.zone2AvgPerDay} min/dag</div>
                    {predictions.zone2CompletionDate && (
                      <div className="text-xs text-slate-600 mt-1">
                        Op koers voor {predictions.zone2CompletionDate.toLocaleDateString("nl-NL", { day: "numeric", month: "short" })}
                      </div>
                    )}
                    <div className={classNames("text-xs mt-1 font-semibold", 
                      predictions.zone2DaysAhead >= 0 ? "text-emerald-700" : "text-rose-700")}>
                      {predictions.zone2DaysAhead >= 0 ? `${predictions.zone2DaysAhead} dagen voorsprong` : `${Math.abs(predictions.zone2DaysAhead)} dagen achterstand`}
                    </div>
                  </div>
                  
                  <div className="bg-amber-50 rounded-lg p-3">
                    <div className="text-xs text-slate-600">Zone 5 Tempo</div>
                    <div className="text-lg font-semibold">{predictions.zone5AvgPerDay} min/dag</div>
                    {predictions.zone5CompletionDate && (
                      <div className="text-xs text-slate-600 mt-1">
                        Op koers voor {predictions.zone5CompletionDate.toLocaleDateString("nl-NL", { day: "numeric", month: "short" })}
                      </div>
                    )}
                    <div className={classNames("text-xs mt-1 font-semibold",
                      predictions.zone5DaysAhead >= 0 ? "text-amber-700" : "text-rose-700")}>
                      {predictions.zone5DaysAhead >= 0 ? `${predictions.zone5DaysAhead} dagen voorsprong` : `${Math.abs(predictions.zone5DaysAhead)} dagen achterstand`}
                    </div>
                  </div>
                </div>
              </Card>
            )}

            {/* Session Records */}
            <Card>
              <h3 className="text-lg font-semibold mb-3">🏅 Persoonlijke Records</h3>
              <div className="grid grid-cols-3 gap-3 text-center">
                <div className="bg-slate-50 rounded-lg p-3">
                  <div className="text-xs text-slate-600">Langste Sessie</div>
                  <div className="text-2xl font-bold text-slate-900">{records.longestSession}</div>
                  <div className="text-xs text-slate-600">minuten</div>
                </div>
                <div className="bg-slate-50 rounded-lg p-3">
                  <div className="text-xs text-slate-600">Meeste Zone 5</div>
                  <div className="text-2xl font-bold text-amber-600">{records.mostZone5}</div>
                  <div className="text-xs text-slate-600">in één dag</div>
                </div>
                <div className="bg-slate-50 rounded-lg p-3">
                  <div className="text-xs text-slate-600">Beste Week</div>
                  <div className="text-2xl font-bold text-slate-900">{records.bestWeek}</div>
                  <div className="text-xs text-slate-600">7 dagen</div>
                </div>
              </div>
            </Card>

            <Card>
              <h3 className="text-xl font-semibold mb-2">April 2026</h3>
              <p className="text-xs text-slate-600 mb-3">Geel = Zone 5 | 💪 = Kracht | 💬 = Notitie</p>
              <div className="weekday-row text-xs text-slate-500 mb-2">
                {WEEKDAYS.map(w => <div key={w} className="text-center">{w}</div>)}
              </div>
              <div className="month-grid">
                {aprCells.map((d, i) => <div key={i}>{dayCell(d)}</div>)}
              </div>
            </Card>
          </div>
        );
      }

      const Card = ({ children }) => <div className="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">{children}</div>;

      const Stat = ({ label, value, sub }) => (
        <div className="bg-white rounded-xl p-3">
          <div className="text-xs text-slate-600">{label}</div>
          <div className="text-2xl font-semibold">{value}</div>
          <div className="text-xs text-slate-600">{sub}</div>
        </div>
      );

      function ExportModal({ url, onClose }) {
        const [copied, setCopied] = React.useState(false);

        function copyUrl() {
          navigator.clipboard.writeText(url).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          });
        }

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
            <div className="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-200 p-6">
              <h3 className="text-xl font-semibold mb-3">Sync naar ander device</h3>
              <p className="text-sm text-slate-600 mb-4">
                Kopieer deze URL en open hem op je andere device. Je data wordt automatisch geladen.
              </p>
              
              <div className="bg-slate-50 rounded-xl p-3 mb-4 break-all text-sm font-mono">
                {url}
              </div>

              <div className="flex justify-end gap-2">
                <button className="px-4 py-2 rounded-xl border" onClick={onClose}>Sluiten</button>
                <button 
                  className="px-4 py-2 rounded-xl bg-slate-900 text-white"
                  onClick={copyUrl}
                >
                  {copied ? "Gekopieerd! ✓" : "Kopieer URL"}
                </button>
              </div>
            </div>
          </div>
        );
      }

      function MinutesModal({ dateYMD, initialZone2, initialZone5, initialStrength, initialNote, onCancel, onSave }) {
        const [z2, setZ2] = React.useState(Number.isFinite(initialZone2) ? initialZone2 : 0);
        const [z5, setZ5] = React.useState(Number.isFinite(initialZone5) ? initialZone5 : 0);
        const [strength, setStrength] = React.useState(!!initialStrength);
        const [noteSelection, setNoteSelection] = React.useState(initialNote || "");
        const [customNote, setCustomNote] = React.useState("");
        const [showCustom, setShowCustom] = React.useState(false);
        
        const d = fromYMD(dateYMD);

        React.useEffect(() => {
          if (initialNote && !NOTE_OPTIONS.includes(initialNote)) {
            setShowCustom(true);
            setCustomNote(initialNote);
            setNoteSelection("Custom...");
          }
        }, [initialNote]);

        function handleNoteChange(val) {
          setNoteSelection(val);
          if (val === "Custom...") {
            setShowCustom(true);
          } else {
            setShowCustom(false);
            setCustomNote("");
          }
        }

        function handleSave() {
          const finalNote = showCustom && customNote.trim() ? customNote.trim() : (noteSelection === "Custom..." ? "" : noteSelection);
          onSave(z2, z5, strength, finalNote);
        }
        
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
            <div className="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-6 max-h-[90vh] overflow-y-auto">
              <div className="text-center">
                <h4 className="text-xl font-semibold">Training loggen</h4>
                <p className="text-sm text-slate-600 mt-1">{d.toLocaleDateString("nl-NL",{ weekday:"long", day:"2-digit", month:"long" })}</p>
              </div>
              
              {/* Zone 2 input */}
              <div className="mt-6">
                <label className="block text-sm font-semibold text-emerald-900">Zone 2 minuten</label>
                <input
                  type="range"
                  min="0"
                  max="180"
                  step="1"
                  value={z2}
                  onChange={e => setZ2(parseInt(e.target.value, 10) || 0)}
                  className="w-full mt-2"
                />
                <div className="mt-2 flex items-center justify-center gap-2">
                  <input
                    type="text"
                    inputMode="numeric"
                    pattern="[0-9]*"
                    className="w-24 border rounded-lg px-3 py-2 text-center"
                    value={String(z2)}
                    onChange={e => {
                      const v = e.target.value.replace(/\D+/g, "").slice(0,4);
                      setZ2(v === "" ? 0 : Math.min(180, parseInt(v,10)));
                    }}
                    onBlur={() => setZ2(prev => Math.min(180, Math.max(0, prev)))}
                  />
                  <span className="text-sm text-slate-600">minuten</span>
                </div>
              </div>

              {/* Zone 5 input */}
              <div className="mt-6">
                <label className="block text-sm font-semibold text-amber-900">Zone 5 minuten</label>
                <input
                  type="range"
                  min="0"
                  max="60"
                  step="1"
                  value={z5}
                  onChange={e => setZ5(parseInt(e.target.value, 10) || 0)}
                  className="w-full mt-2"
                />
                <div className="mt-2 flex items-center justify-center gap-2">
                  <input
                    type="text"
                    inputMode="numeric"
                    pattern="[0-9]*"
                    className="w-24 border rounded-lg px-3 py-2 text-center"
                    value={String(z5)}
                    onChange={e => {
                      const v = e.target.value.replace(/\D+/g, "").slice(0,3);
                      setZ5(v === "" ? 0 : Math.min(60, parseInt(v,10)));
                    }}
                    onBlur={() => setZ5(prev => Math.min(60, Math.max(0, prev)))}
                  />
                  <span className="text-sm text-slate-600">minuten</span>
                </div>
              </div>

              {/* Strength checkbox */}
              <div className="mt-6">
                <label className="flex items-center gap-3 cursor-pointer bg-purple-50 rounded-lg p-3 border border-purple-200">
                  <input
                    type="checkbox"
                    checked={strength}
                    onChange={e => setStrength(e.target.checked)}
                    className="w-5 h-5"
                  />
                  <div>
                    <div className="text-sm font-semibold text-purple-900">Krachtsessie gedaan 💪</div>
                    <div className="text-xs text-purple-700">Vink aan als je vandaag kracht hebt getraind</div>
                  </div>
                </label>
              </div>

              {/* Note dropdown */}
              <div className="mt-6">
                <label className="block text-sm font-semibold text-slate-900">Sessie notitie (optioneel)</label>
                <select 
                  className="mt-2 w-full border rounded-lg px-3 py-2"
                  value={noteSelection}
                  onChange={e => handleNoteChange(e.target.value)}
                >
                  <option value="">Geen notitie</option>
                  {NOTE_OPTIONS.map(opt => (
                    <option key={opt} value={opt}>{opt}</option>
                  ))}
                </select>
              </div>

              {/* Custom note input */}
              {showCustom && (
                <div className="mt-3">
                  <input
                    type="text"
                    className="w-full border rounded-lg px-3 py-2"
                    placeholder="Typ je eigen notitie..."
                    value={customNote}
                    onChange={e => setCustomNote(e.target.value)}
                    maxLength={50}
                  />
                </div>
              )}

              <div className="mt-4 text-xs text-slate-600 text-center">
                Zone 5 minuten tellen ook mee voor Zone 2 doel
              </div>

              <div className="mt-6 flex justify-end gap-2">
                <button className="px-4 py-2 rounded-xl border" onClick={onCancel}>Annuleren</button>
                <button className="px-4 py-2 rounded-xl bg-slate-900 text-white" onClick={handleSave}>Opslaan</button>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
